name: Build installers

# Produces the WEKA-style Windows setup (tode-setup.exe) and a Linux bundle.
# Run manually from the Actions tab, or automatically on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # ── Windows: PyInstaller bundle → Inno Setup wizard ──────────────────────────
  windows:
    name: Windows installer (tode-setup.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build bundle (PyInstaller)
        run: pyinstaller packaging/tode.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        run: iscc packaging\tode_installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tode-windows-setup
          path: packaging/Output/tode-setup.exe

  # ── Linux: PyInstaller one-dir bundle → tarball ──────────────────────────────
  linux:
    name: Linux bundle (tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system libs for Qt + OpenCV
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build bundle (PyInstaller)
        run: pyinstaller packaging/tode.spec --noconfirm

      - name: Package tarball
        run: cd dist && tar -czf tode-linux-x86_64.tar.gz tode

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: tode-linux-bundle
          path: dist/tode-linux-x86_64.tar.gz
